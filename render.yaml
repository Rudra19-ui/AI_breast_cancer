# Render Blueprint: static hosting for the HTML paper viewer.
# Deploy: Dashboard → Blueprints → New Blueprint Instance → connect this repo → apply.
#
# Docs: https://docs.render.com/blueprint-spec
# Static sites: https://render.com/docs/static-sites

services:
  - type: web
    name: research-paper-viewer
    runtime: static
    # No build step; publish repository root as-is.
    staticPublishPath: .
    routes:
      # Canonical path in the browser bar (no ".html").
      # See: https://render.com/docs/redirects-rewrites
      - type: redirect
        source: /
        destination: /research_paper_v2
      - type: redirect
        source: /research_paper_v2.html
        destination: /research_paper_v2
      - type: rewrite
        source: /research_paper_v2
        destination: /research_paper_v2.html
